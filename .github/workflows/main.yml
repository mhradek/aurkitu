name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  FLATC_VERSION: 25.12.19

permissions:
  contents: read

jobs:
  build:
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported Java (17, what the release is built with) and the current LTS versions.
        java: [ '17', '21', '25' ]
    env:
      # Coverage is uploaded once, from the Java 17 build. Not from Dependabot or fork PRs: GitHub gives them
      # no repository secrets, so the uploads would fail although the build and tests passed.
      UPLOAD_COVERAGE: ${{ matrix.java == '17' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Download flatc
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc
          echo "/tmp/flatc-bin" >> $GITHUB_PATH
          /tmp/flatc-bin/flatc --version

      - name: Build with Maven
        run: mvn -B clean verify
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc

      - name: Diagnose coverage reports and tokens
        if: env.UPLOAD_COVERAGE == 'true'
        run: |
          echo "=== JaCoCo reports ==="
          find . -path "*/target/site/jacoco/jacoco.xml" -type f | head -20
          echo "=== Token presence (values not printed) ==="
          if [ -n "$CODECOV_TOKEN" ]; then echo "CODECOV_TOKEN: set"; else echo "CODECOV_TOKEN: missing"; fi
          if [ -n "$COVERALLS_REPO_TOKEN" ]; then echo "COVERALLS_REPO_TOKEN: set"; else echo "COVERALLS_REPO_TOKEN: missing"; fi
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then echo "CODACY_PROJECT_TOKEN: set"; else echo "CODACY_PROJECT_TOKEN: missing"; fi
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      - name: Upload coverage to Codecov
        if: env.UPLOAD_COVERAGE == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            aurkitu-annotations/target/site/jacoco/jacoco.xml,
            aurkitu-core/target/site/jacoco/jacoco.xml,
            aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage to Coveralls
        if: env.UPLOAD_COVERAGE == 'true'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # All modules, as for Codecov and Codacy.
          files: >-
            aurkitu-annotations/target/site/jacoco/jacoco.xml
            aurkitu-core/target/site/jacoco/jacoco.xml
            aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          format: jacoco

      - name: Upload coverage to Codacy
        if: env.UPLOAD_COVERAGE == 'true'
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: >-
            aurkitu-annotations/target/site/jacoco/jacoco.xml,
            aurkitu-core/target/site/jacoco/jacoco.xml,
            aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          language: Java

  # The Gradle plugin is its own Gradle build. It runs the generator in real builds (TestKit), with the oldest
  # and newest Gradle versions it is tested with, and checks the schemas with flatc like the Maven ITs do. The
  # newest Gradle also runs on each Java the Maven build is tested with (Gradle 8.14 does not run on Java 25).
  gradle-plugin:
    name: gradle plugin (Gradle ${{ matrix.gradle }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gradle: '8.14.3', java: '17' }
          - { gradle: '9.9.0', java: '17' }
          - { gradle: '9.9.0', java: '21' }
          - { gradle: '9.9.0', java: '25' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Download flatc
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc

      # The plugin uses aurkitu-core of the same version, from the local Maven repository.
      - name: Install the Maven modules
        run: mvn -B -q install -DskipTests -Dinvoker.skip -Djacoco.skip -Dspotbugs.skip -Djapicmp.skip

      - name: Build and test the Gradle plugin
        working-directory: aurkitu-gradle-plugin
        run: gradle build
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc

  # The sample in samples/game, built with Maven and with Gradle against this commit: both must write
  # samples/game/expected/game.fbs, which flatc must compile. Keeps the sample true to what Aurkitu writes.
  samples:
    name: samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.9.0'

      - name: Download flatc
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc

      - name: Install the Maven modules
        run: mvn -B -q install -DskipTests -Dinvoker.skip -Djacoco.skip -Dspotbugs.skip -Djapicmp.skip

      - name: Build and check the sample
        run: samples/verify.sh --this-checkout
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc
