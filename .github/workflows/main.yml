name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  FLATC_VERSION: 25.12.19

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download flatc
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc
          echo "/tmp/flatc-bin" >> $GITHUB_PATH
          /tmp/flatc-bin/flatc --version

      - name: Build with Maven
        run: mvn -B clean verify
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc

      - name: Diagnose coverage reports and tokens
        run: |
          echo "=== JaCoCo reports ==="
          find . -path "*/target/site/jacoco/jacoco.xml" -type f | head -20
          echo "=== Token presence (values not printed) ==="
          if [ -n "$CODECOV_TOKEN" ]; then echo "CODECOV_TOKEN: set"; else echo "CODECOV_TOKEN: missing"; fi
          if [ -n "$COVERALLS_REPO_TOKEN" ]; then echo "COVERALLS_REPO_TOKEN: set"; else echo "COVERALLS_REPO_TOKEN: missing"; fi
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then echo "CODACY_PROJECT_TOKEN: set"; else echo "CODACY_PROJECT_TOKEN: missing"; fi
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            aurkitu-annotations/target/site/jacoco/jacoco.xml,
            aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          format: jacoco
          # Optional: also send the annotations report if desired
          # parallel: true

      - name: Upload coverage to Codacy
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: >-
            aurkitu-annotations/target/site/jacoco/jacoco.xml,
            aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          language: Java
