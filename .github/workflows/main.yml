name: Build

on:
  push:
    branches: [ master, main, v1.0.0-modern ]
  pull_request:
    branches: [ master, main, v1.0.0-modern ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download flatc
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc
          echo "/tmp/flatc-bin" >> $GITHUB_PATH
          /tmp/flatc-bin/flatc --version

      - name: Build with Maven
        run: mvn -B clean verify
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            aurkitu-annotations/target/site/jacoco/jacoco.xml,
            aurkitu-maven-plugin/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

