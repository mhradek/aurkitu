name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn -B clean verify
      # Central Portal / GPG signing steps to be added when publishing credentials are ready
      - name: Note
        run: echo "Publishing configuration (GPG + Central Portal) to be completed"
