name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

env:
  # Same flatc as the build workflow: the end-to-end tests require it in CI.
  FLATC_VERSION: 25.12.19

jobs:
  # Maven Central: the annotations, aurkitu-core, the Maven plugin and the parent POM. Before deploying, it also
  # builds and tests the Gradle plugin, so a broken Gradle plugin stops the release before anything is public
  # (a deploy to Central cannot be undone).
  maven:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.central.outputs.version }}
      just-published: ${{ steps.central.outputs.published != 'true' }}
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      # Builds the ref that triggered the run: the release tag, or the branch picked for a manual run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Makes re-runs safe: e.g. creating the GitHub release after a manual publish of the same tag.
      - name: Check whether this version is already on Maven Central
        id: central
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          URL="https://repo1.maven.org/maven2/io/github/mhradek/aurkitu-maven-plugin/${VERSION}/aurkitu-maven-plugin-${VERSION}.pom"
          if curl -sfI "$URL" > /dev/null; then
            echo "::notice::${VERSION} is already on Maven Central; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${VERSION}."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Central credentials
        if: steps.central.outputs.published != 'true'
        run: |
          python3 - << 'PY2'
          from pathlib import Path
          import os
          text = Path.home().joinpath(".m2/settings.xml").read_text()
          user_len = len(os.environ.get("MAVEN_USERNAME", ""))
          pass_len = len(os.environ.get("MAVEN_PASSWORD", ""))
          print(f"MAVEN_USERNAME length: {user_len}")
          print(f"MAVEN_PASSWORD length: {pass_len}")
          print("settings has server id central:", "<id>central</id>" in text)
          print("settings username empty:", "<username></username>" in text or "<username/>" in text)
          PY2
      - name: Import GPG key
        if: steps.central.outputs.published != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY secret is empty"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | head -1
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          if [ -z "${KEY_ID}" ]; then
            echo "No secret key imported. GPG_PRIVATE_KEY must be an armored PRIVATE key block."
            exit 1
          fi
          echo "Imported key: ${KEY_ID}"
          echo "${KEY_ID}:6:" | gpg --import-ownertrust
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye || true
          echo "KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
      - name: Download flatc
        if: steps.central.outputs.published != 'true'
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc
          /tmp/flatc-bin/flatc --version
      # install, not just verify: the Gradle plugin builds against aurkitu-core from the local Maven repository.
      - name: Build
        if: steps.central.outputs.published != 'true'
        run: mvn -B clean install
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.central.outputs.published != 'true'
        with:
          gradle-version: '9.9.0'
      - name: Build and test the Gradle plugin
        if: steps.central.outputs.published != 'true'
        working-directory: aurkitu-gradle-plugin
        run: gradle build
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc
      - name: Publish to Maven Central
        if: steps.central.outputs.published != 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -P release -DskipTests -Dinvoker.skip=true \
            -Daether.syncContext.named.factory=rwlock-local \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Dgpg.keyname="${KEY_ID}"

  # The Gradle Plugin Portal, with the same version, after the Maven deploy: the plugin needs aurkitu-core of that
  # version on Maven Central. Re-running this job (or the workflow) is safe: a version already on the portal is
  # skipped. It fails, rather than skipping, when the portal's keys are missing or aurkitu-core is not on Central.
  gradle:
    needs: maven
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the Gradle plugin can and should be published
        id: portal
        env:
          VERSION: ${{ needs.maven.outputs.version }}
          JUST_PUBLISHED: ${{ needs.maven.outputs.just-published }}
          HAS_KEY: ${{ secrets.GRADLE_PUBLISH_KEY != '' && secrets.GRADLE_PUBLISH_SECRET != '' }}
        run: |
          CORE="https://repo1.maven.org/maven2/io/github/mhradek/aurkitu-core/${VERSION}/aurkitu-core-${VERSION}.pom"
          MARKER="https://plugins.gradle.org/m2/io/github/mhradek/aurkitu/io.github.mhradek.aurkitu.gradle.plugin/${VERSION}/io.github.mhradek.aurkitu.gradle.plugin-${VERSION}.pom"
          # -L: for anything it does not host, the portal redirects (303) to Maven Central, which then gives
          # the real answer. Without following it, the redirect itself would count as "already published".
          if curl -sfIL "$MARKER" > /dev/null; then
            echo "::notice::The Gradle plugin ${VERSION} is already on the Gradle Plugin Portal; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::The GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET repository secrets are not set, so the Gradle plugin ${VERSION} cannot be published. Add them (Settings > Secrets and variables > Actions > Repository secrets) and re-run this job."
            exit 1
          fi
          # Just deployed: Central can take a while to serve it, but it is on its way.
          if [ "$JUST_PUBLISHED" != "true" ] && ! curl -sfIL "$CORE" > /dev/null; then
            echo "::error::aurkitu-core ${VERSION} is not on Maven Central, so the Gradle plugin would not resolve. Publish the Maven artifacts first."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.portal.outputs.publish == 'true'
      - name: Set up JDK 17
        if: steps.portal.outputs.publish == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.portal.outputs.publish == 'true'
        with:
          gradle-version: '9.9.0'
      - name: Download flatc
        if: steps.portal.outputs.publish == 'true'
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc
      # Tested again here: a re-run of this job alone, or of a version already on Central, skips the Maven job's tests.
      - name: Publish the Gradle plugin
        if: steps.portal.outputs.publish == 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          FLATC_PATH: /tmp/flatc-bin/flatc
        run: |
          # aurkitu-core of this version in the local Maven repository, which the Gradle plugin builds against.
          mvn -B -q install -DskipTests -Dinvoker.skip -Djacoco.skip -Dspotbugs.skip -Djapicmp.skip
          cd aurkitu-gradle-plugin
          gradle build publishPlugins
