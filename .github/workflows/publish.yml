name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

env:
  # Same flatc as the build workflow: the end-to-end tests require it in CI.
  FLATC_VERSION: 25.12.19

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      # Builds the ref that triggered the run: the release tag, or the branch picked for a manual run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      # Makes re-runs safe: e.g. creating the GitHub release after a manual publish of the same tag.
      - name: Check whether this version is already on Maven Central
        id: central
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          URL="https://repo1.maven.org/maven2/io/github/mhradek/aurkitu-maven-plugin/${VERSION}/aurkitu-maven-plugin-${VERSION}.pom"
          if curl -sfI "$URL" > /dev/null; then
            echo "::notice::${VERSION} is already on Maven Central; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${VERSION}."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Central credentials
        if: steps.central.outputs.published != 'true'
        run: |
          python3 - << 'PY2'
          from pathlib import Path
          import os
          text = Path.home().joinpath(".m2/settings.xml").read_text()
          user_len = len(os.environ.get("MAVEN_USERNAME", ""))
          pass_len = len(os.environ.get("MAVEN_PASSWORD", ""))
          print(f"MAVEN_USERNAME length: {user_len}")
          print(f"MAVEN_PASSWORD length: {pass_len}")
          print("settings has server id central:", "<id>central</id>" in text)
          print("settings username empty:", "<username></username>" in text or "<username/>" in text)
          PY2
      - name: Import GPG key
        if: steps.central.outputs.published != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY secret is empty"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | head -1
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          if [ -z "${KEY_ID}" ]; then
            echo "No secret key imported. GPG_PRIVATE_KEY must be an armored PRIVATE key block."
            exit 1
          fi
          echo "Imported key: ${KEY_ID}"
          echo "${KEY_ID}:6:" | gpg --import-ownertrust
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye || true
          echo "KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
      # Also for the Gradle plugin's tests, so not skipped with the Maven steps.
      - name: Download flatc
        run: |
          curl -sL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip
          unzip -o flatc.zip -d /tmp/flatc-bin
          chmod +x /tmp/flatc-bin/flatc
          /tmp/flatc-bin/flatc --version
      - name: Build
        if: steps.central.outputs.published != 'true'
        run: mvn -B clean verify
        env:
          FLATC_PATH: /tmp/flatc-bin/flatc
      - name: Publish to Maven Central
        if: steps.central.outputs.published != 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -P release -DskipTests -Dinvoker.skip=true \
            -Daether.syncContext.named.factory=rwlock-local \
            -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -Dgpg.keyname="${KEY_ID}"

      # The Gradle plugin goes to the Gradle Plugin Portal, with the same version. It needs aurkitu-core of that
      # version on Maven Central (just published above, or already there), and the portal's API key as the
      # GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET secrets: without them this is skipped with a warning.
      - name: Check whether the Gradle plugin can and should be published
        id: portal
        env:
          JUST_PUBLISHED: ${{ steps.central.outputs.published != 'true' }}
          HAS_KEY: ${{ secrets.GRADLE_PUBLISH_KEY != '' && secrets.GRADLE_PUBLISH_SECRET != '' }}
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          CORE="https://repo1.maven.org/maven2/io/github/mhradek/aurkitu-core/${VERSION}/aurkitu-core-${VERSION}.pom"
          MARKER="https://plugins.gradle.org/m2/io/github/mhradek/aurkitu/io.github.mhradek.aurkitu.gradle.plugin/${VERSION}/io.github.mhradek.aurkitu.gradle.plugin-${VERSION}.pom"
          publish=true
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET are not set; the Gradle plugin is not published."
            publish=false
          # -L: for anything it does not host, the portal redirects (303) to Maven Central, which then gives
          # the real answer. Without following it, the redirect itself would count as "already published".
          elif curl -sfIL "$MARKER" > /dev/null; then
            echo "::notice::The Gradle plugin ${VERSION} is already on the Gradle Plugin Portal."
            publish=false
          elif [ "$JUST_PUBLISHED" != "true" ] && ! curl -sfIL "$CORE" > /dev/null; then
            echo "::warning::aurkitu-core ${VERSION} is not on Maven Central; the Gradle plugin would not resolve."
            publish=false
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.portal.outputs.publish == 'true'
        with:
          gradle-version: '8.14.3'
      - name: Publish the Gradle plugin
        if: steps.portal.outputs.publish == 'true'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          FLATC_PATH: /tmp/flatc-bin/flatc
        run: |
          # aurkitu-core of this version in the local Maven repository (a deploy above already installed it).
          mvn -B -q install -DskipTests -Dinvoker.skip -Djacoco.skip -Dspotbugs.skip -Djapicmp.skip
          cd aurkitu-gradle-plugin
          gradle build publishPlugins
