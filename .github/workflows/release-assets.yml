# Builds the GitHub release for a tag: creates it as a draft (notes from CHANGELOG.md), attaches the artifacts and
# their signatures (the .asc files published to Maven Central), so users (and OpenSSF Scorecard) can verify the
# release from GitHub too, and publishes it only once everything is attached. Nothing is added after publishing,
# so this works with immutable releases (Settings > General > Releases), which lock a release's assets and tag.
#
# It also rebuilds the release tag here and compares the result with Maven Central, byte for byte (the build
# is reproducible). For the files that match, it attaches SLSA build provenance (<tag>.intoto.jsonl): a signed
# statement that this repository's workflow, at this tag, builds exactly those files. Releases built before
# reproducible builds (1.1.1 and earlier) do not match, so they get no provenance.
name: Release assets

# Started by the same tag push as publish.yml, it waits for that deploy on Maven Central. A manual run finishes a
# release whose run failed, or adds assets to an older release published before releases were made immutable.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the release for (e.g. 1.5.0); it must already be on Maven Central
        required: true

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      subjects: ${{ steps.reproduce.outputs.subjects }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: source
          persist-credentials: false

      # A draft can still change, so the assets go on it before it is published. A release that already exists is
      # kept as it is, notes included: e.g. a draft written by hand before pushing the tag, or an older release.
      - name: Create the draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release ${TAG} already exists"; exit 0
          fi
          awk -v heading="## [${TAG}]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' \
            source/CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" "${notes[@]}"

      # The artifacts come from Maven Central, so they are exactly what users download, already signed.
      # A release published right after the deploy can take a while to appear there: wait up to an hour.
      - name: Wait for the release on Maven Central
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/io/github/mhradek/aurkitu-maven-plugin/${TAG}/aurkitu-maven-plugin-${TAG}.pom"
          for i in $(seq 1 60); do
            if curl -sfI "$url" > /dev/null; then echo "${TAG} is on Maven Central"; exit 0; fi
            echo "Waiting for ${TAG} on Maven Central (${i}/60)"; sleep 60
          done
          echo "::error::${TAG} did not appear on Maven Central within an hour"; exit 1

      - name: Download artifacts and signatures
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          base="https://repo1.maven.org/maven2/io/github/mhradek"
          files=(
            "aurkitu-parent/${TAG}/aurkitu-parent-${TAG}.pom"
            "aurkitu-annotations/${TAG}/aurkitu-annotations-${TAG}.pom"
            "aurkitu-annotations/${TAG}/aurkitu-annotations-${TAG}.jar"
            "aurkitu-annotations/${TAG}/aurkitu-annotations-${TAG}-sources.jar"
            "aurkitu-annotations/${TAG}/aurkitu-annotations-${TAG}-javadoc.jar"
            "?aurkitu-core/${TAG}/aurkitu-core-${TAG}.pom"
            "?aurkitu-core/${TAG}/aurkitu-core-${TAG}.jar"
            "?aurkitu-core/${TAG}/aurkitu-core-${TAG}-sources.jar"
            "?aurkitu-core/${TAG}/aurkitu-core-${TAG}-javadoc.jar"
            "aurkitu-maven-plugin/${TAG}/aurkitu-maven-plugin-${TAG}.pom"
            "aurkitu-maven-plugin/${TAG}/aurkitu-maven-plugin-${TAG}.jar"
            "aurkitu-maven-plugin/${TAG}/aurkitu-maven-plugin-${TAG}-sources.jar"
            "aurkitu-maven-plugin/${TAG}/aurkitu-maven-plugin-${TAG}-javadoc.jar"
          )
          for f in "${files[@]}"; do
            # "?": only in some releases (aurkitu-core is new after 1.2.0); skipped when the release has no such file.
            if [[ "$f" == "?"* ]]; then
              f="${f#?}"
              if ! curl -sfI --retry 5 --retry-all-errors "${base}/${f}" > /dev/null; then
                echo "Not in ${TAG}: ${f}"; continue
              fi
            fi
            for suffix in "" ".asc"; do
              # Central rate-limits bursts (HTTP 429); curl honours its Retry-After and backs off.
              curl -sSf --retry 10 --retry-all-errors --retry-max-time 600 -O "${base}/${f}${suffix}"
              sleep 1
            done
          done
          ls -l

      - name: Attach to the GitHub release
        run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Same artifacts as the publish workflow (release profile, without signing); tests ran when it was built.
      - name: Rebuild the tag and compare with Maven Central
        id: reproduce
        run: |
          set -euo pipefail
          (cd source && mvn -B -q package -P release -Dgpg.skip -DskipTests -Dinvoker.skip -Djacoco.skip \
              -Dspotbugs.skip -Djapicmp.skip)
          cp source/pom.xml "source/aurkitu-parent-${TAG}.pom"
          cp source/aurkitu-annotations/pom.xml "source/aurkitu-annotations/target/aurkitu-annotations-${TAG}.pom"
          if [ -f source/aurkitu-core/pom.xml ]; then
            cp source/aurkitu-core/pom.xml "source/aurkitu-core/target/aurkitu-core-${TAG}.pom"
          fi
          cp source/aurkitu-maven-plugin/pom.xml "source/aurkitu-maven-plugin/target/aurkitu-maven-plugin-${TAG}.pom"
          matched=()
          for published in assets/*; do
            name=$(basename "$published")
            case "$name" in *.asc) continue ;; esac
            built=$(find source -name "$name" -not -path '*/src/*' | head -1)
            if [ -n "$built" ] && cmp -s "$built" "$published"; then
              echo "reproduced: $name"; matched+=("$name")
            else
              echo "::warning::$name: the rebuild does not match Maven Central; no provenance for it"
            fi
          done
          if [ ${#matched[@]} -eq 0 ]; then
            echo "Nothing reproduced (a release from before reproducible builds); no provenance."
            echo "subjects=" >> "$GITHUB_OUTPUT"
          else
            echo "subjects=$(cd assets && sha256sum "${matched[@]}" | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

  # SLSA level 3 provenance for the reproduced files. The generator must be referenced by tag (it verifies its own
  # identity), which Scorecard accepts as pinned. It keeps the provenance as a workflow artifact; the publish job
  # attaches it, since the generator's own upload does not find draft releases reliably.
  provenance:
    needs: attach
    if: needs.attach.outputs.subjects != ''
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.attach.outputs.subjects }}
      upload-assets: false
      provenance-name: aurkitu-${{ inputs.tag || github.ref_name }}.intoto.jsonl

  # Attaches the provenance and publishes the draft, the last change to the release. Runs when there was nothing
  # to prove (no provenance job) too, but not when the provenance failed: the draft then waits for a re-run.
  publish:
    needs: [attach, provenance]
    if: ${{ !cancelled() && needs.attach.result == 'success' && needs.provenance.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Attach the provenance
        if: needs.provenance.result == 'success'
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PROVENANCE" --dir provenance
          gh release upload "$TAG" provenance/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "Published ${TAG}"
          else
            echo "${TAG} was already published"
          fi
