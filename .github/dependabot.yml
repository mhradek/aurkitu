# Weekly dependency and GitHub Actions updates, grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # ClassGraph 6 removed APIs the plugin uses (type signatures, getAnnotationInfo(String));
      # moving to it is a migration, done by hand.
      - dependency-name: io.github.classgraph:classgraph
        update-types: [ "version-update:semver-major" ]
    groups:
      maven:
        patterns: [ "*" ]
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
