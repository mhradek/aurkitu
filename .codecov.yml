coverage:
  status:
    project:
      default:
        target: 50%
        threshold: 2%
    patch:
      default:
        target: 50%

ignore:
  - "**/Config.java"
  - "**/generated/**"
  - "**/target/**"

fixes:
  - "aurkitu-annotations/src/main/java/::aurkitu-annotations/src/main/java/"
  - "aurkitu-maven-plugin/src/main/java/::aurkitu-maven-plugin/src/main/java/"
